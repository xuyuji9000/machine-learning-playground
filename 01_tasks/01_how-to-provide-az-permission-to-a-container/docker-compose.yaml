services:
  azure-worker:
    image: mcr.microsoft.com/azure-cli:latest
    container_name: azure-worker
    env_file:
      - .env
    command: >
      sh -c "az login                 \
      --service-principal             \
      --username $AZURE_CLIENT_ID     \
      --password $AZURE_CLIENT_SECRET \
      --tenant $AZURE_TENANT_ID       \
      && az account show -otable"